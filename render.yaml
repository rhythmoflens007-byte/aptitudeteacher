# Render blueprint for the API (the website itself is hosted on Vercel from apps/web).
services:
  - type: web
    name: aptitude-teacher-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Filled in by hand in the Render dashboard; never committed.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
